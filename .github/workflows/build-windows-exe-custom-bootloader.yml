name: Build Windows EXE (custom launcher)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate the project folder
        id: loc
        shell: bash
        run: |
          SPEC=$(find . -name app.spec -not -path "./.git/*" | head -n 1)
          if [ -z "$SPEC" ]; then
            echo "::error::app.spec was not found in this repository."
            exit 1
          fi
          DIR=$(dirname "$SPEC")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile PyInstaller's launcher from source
        shell: pwsh
        run: |
          git clone --depth 1 --branch v6.22.3 https://github.com/pyinstaller/pyinstaller.git "$env:RUNNER_TEMP/pyi-src"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location "$env:RUNNER_TEMP/pyi-src/bootloader"
          python ./waf all --target-arch=64bit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location "$env:RUNNER_TEMP/pyi-src"
          pip install --force-reinstall --no-deps .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build EXE with PyInstaller
        working-directory: ${{ steps.loc.outputs.dir }}
        run: pyinstaller app.spec --noconfirm

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: TestLinkWEFormatter-Windows-custom-launcher
          path: ${{ steps.loc.outputs.dir }}/dist/TestLinkWEFormatter/
